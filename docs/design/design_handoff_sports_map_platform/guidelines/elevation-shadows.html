<!-- @dsCard group="Elevation" viewport="700x210" subtitle="Soft, warm bark-green tint · never pure black" name="Shadows" -->
<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  .row{display:flex;gap:24px;padding:32px 30px;flex-wrap:wrap;}
  .card{width:120px;height:78px;background:var(--surface);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
  .cap{margin-top:10px;font-family:var(--font-mono);font-size:11px;color:var(--ink);font-weight:600;text-align:center;}
</style>
</head>
<body>
<div class="row">
  <div><div class="card" style="box-shadow:var(--shadow-xs)">xs</div><div class="cap">--shadow-xs</div></div>
  <div><div class="card" style="box-shadow:var(--shadow-sm)">sm</div><div class="cap">--shadow-sm</div></div>
  <div><div class="card" style="box-shadow:var(--shadow-md)">md</div><div class="cap">--shadow-md</div></div>
  <div><div class="card" style="box-shadow:var(--shadow-lg)">lg</div><div class="cap">--shadow-lg</div></div>
  <div><div class="card" style="box-shadow:var(--shadow-float)">float</div><div class="cap">--shadow-float</div></div>
</div>
</body>
</html>
