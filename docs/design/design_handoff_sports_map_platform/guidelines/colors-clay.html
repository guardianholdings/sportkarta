<!-- @dsCard group="Colors" viewport="700x160" subtitle="Accent / activity · --accent = clay-500" name="Clay (accent)" -->
<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .row {
        display: flex;
        gap: 0;
        padding: 24px 26px 20px;
      }
      .sw {
        flex: 1;
        height: 64px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding-bottom: 6px;
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
      }
      .sw:first-child {
        border-radius: var(--radius-md) 0 0 var(--radius-md);
      }
      .sw:last-child {
        border-radius: 0 var(--radius-md) var(--radius-md) 0;
      }
      .tag {
        margin: 0 26px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="sw" style="background: var(--clay-50); color: var(--clay-700)">50</div>
      <div class="sw" style="background: var(--clay-100); color: var(--clay-700)">100</div>
      <div class="sw" style="background: var(--clay-200); color: var(--clay-700)">200</div>
      <div class="sw" style="background: var(--clay-300); color: var(--clay-700)">300</div>
      <div class="sw" style="background: var(--clay-400); color: #fff">400</div>
      <div
        class="sw"
        style="
          background: var(--clay-500);
          color: #fff;
          outline: 2px solid var(--ink);
          outline-offset: -2px;
        "
      >
        500
      </div>
      <div class="sw" style="background: var(--clay-600); color: #fff">600</div>
      <div class="sw" style="background: var(--clay-700); color: #fff">700</div>
    </div>
    <div class="tag">
      --accent = clay-500 · one accent moment per view · CTAs on photography, live & earned states
    </div>
  </body>
</html>
