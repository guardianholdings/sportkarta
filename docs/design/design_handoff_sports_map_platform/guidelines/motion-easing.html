<!-- @dsCard group="Motion" viewport="700x210" subtitle="Calm easing · trail overshoot for delight only" name="Easing & duration" -->
<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .wrap {
        padding: 22px 28px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .track {
        position: relative;
        height: 26px;
        background: var(--paper-sunk);
        border-radius: var(--radius-pill);
        overflow: hidden;
      }
      .dot {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--brand);
      }
      .d1 {
        animation: run 2.4s var(--ease-standard) infinite alternate;
      }
      .d2 {
        animation: run 2.4s var(--ease-out) infinite alternate;
      }
      .d3 {
        animation: run 2.4s var(--ease-trail) infinite alternate;
        background: var(--accent);
      }
      @keyframes run {
        to {
          left: calc(100% - 23px);
        }
      }
      .lbl {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
      }
      .lbl b {
        color: var(--ink);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="lbl"><b>--ease-standard</b> · UI transitions · 120–240ms</div>
        <div class="track"><div class="dot d1"></div></div>
      </div>
      <div>
        <div class="lbl"><b>--ease-out</b> · entrances · 240ms</div>
        <div class="track"><div class="dot d2"></div></div>
      </div>
      <div>
        <div class="lbl"><b>--ease-trail</b> · badge / marker drop only</div>
        <div class="track"><div class="dot d3"></div></div>
      </div>
    </div>
  </body>
</html>
