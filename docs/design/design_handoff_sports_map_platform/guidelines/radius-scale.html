<!-- @dsCard group="Spacing" viewport="700x180" subtitle="Pills for actions · md inputs · lg/xl surfaces" name="Radius" -->
<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .row {
        display: flex;
        gap: 20px;
        padding: 26px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .box {
        width: 76px;
        height: 76px;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        box-shadow: var(--shadow-sm);
      }
      .cap {
        margin-top: 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
      }
      .cap b {
        display: block;
        color: var(--ink);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div>
        <div class="box" style="border-radius: var(--radius-sm)"></div>
        <div class="cap"><b>sm</b>8</div>
      </div>
      <div>
        <div class="box" style="border-radius: var(--radius-md)"></div>
        <div class="cap"><b>md</b>10 · inputs</div>
      </div>
      <div>
        <div class="box" style="border-radius: var(--radius-lg)"></div>
        <div class="cap"><b>lg</b>14 · cards</div>
      </div>
      <div>
        <div class="box" style="border-radius: var(--radius-xl)"></div>
        <div class="cap"><b>xl</b>20 · sheets</div>
      </div>
      <div>
        <div class="box" style="border-radius: var(--radius-2xl)"></div>
        <div class="cap"><b>2xl</b>28</div>
      </div>
      <div>
        <div class="box" style="width: 110px; border-radius: var(--radius-pill)"></div>
        <div class="cap"><b>pill</b>buttons · chips</div>
      </div>
    </div>
  </body>
</html>
