<!-- @dsCard group="Colors" viewport="700x210" subtitle="Warm paper, surfaces, ink & borders" name="Neutrals" -->
<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        padding: 22px 26px;
      }
      .sw {
        border-radius: var(--radius-md);
        height: 56px;
        border: 1px solid var(--line);
      }
      .lbl {
        margin-top: 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
        line-height: 1.35;
      }
      .lbl b {
        display: block;
        color: var(--ink);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div>
        <div class="sw" style="background: var(--paper)"></div>
        <div class="lbl"><b>--paper</b>#FBF9F3</div>
      </div>
      <div>
        <div class="sw" style="background: var(--paper-sunk)"></div>
        <div class="lbl"><b>--paper-sunk</b>#F4F1E8</div>
      </div>
      <div>
        <div class="sw" style="background: var(--surface)"></div>
        <div class="lbl"><b>--surface</b>#FFFEFB</div>
      </div>
      <div>
        <div class="sw" style="background: var(--ink)"></div>
        <div class="lbl"><b>--ink</b>#1E241D</div>
      </div>
      <div>
        <div class="sw" style="background: var(--ink-soft)"></div>
        <div class="lbl"><b>--ink-soft</b>#3A4136</div>
      </div>
      <div>
        <div class="sw" style="background: var(--text-muted)"></div>
        <div class="lbl"><b>--text-muted</b>#7C7668</div>
      </div>
      <div>
        <div class="sw" style="background: var(--text-faint)"></div>
        <div class="lbl"><b>--text-faint</b>#A79F8E</div>
      </div>
      <div>
        <div class="sw" style="background: var(--border)"></div>
        <div class="lbl"><b>--border</b>#E8E3D8</div>
      </div>
      <div>
        <div class="sw" style="background: var(--border-strong)"></div>
        <div class="lbl"><b>--border-strong</b>#D6CFC0</div>
      </div>
      <div>
        <div class="sw" style="background: var(--surface-2)"></div>
        <div class="lbl"><b>--surface-2</b>#F8F5EE</div>
      </div>
    </div>
  </body>
</html>
