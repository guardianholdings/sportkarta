name: E2E

# WHY THIS IS NOT IN ci.yml, AND THEREFORE NOT A DEPLOY GATE (2026-08-09).
#
# Playwright drives `next dev`. On a GitHub runner the dev server corrupts its
# own manifests part-way through the suite — every page then 500s with
# "SyntaxError: Unexpected non-whitespace character after JSON at position N"
# (N constant within a run, different between runs: one shared file being read
# while it is rewritten), and the job hangs until it is killed. Raising the heap
# to 4 GB did not fix it.
#
# It is provably a DEV-SERVER fault, not an application fault: the same commit
# builds cleanly with `next build`, and `next start` serves every page 200 with
# zero such errors — which is exactly how production runs, and production is
# healthy. So this suite's signal about the shipped artifact is weak, while its
# power to block every deploy for an hour is total. Gating releases on it was
# costing more truth than it bought.
#
# What still gates a deploy, in ci.yml: typecheck, lint, formatting, the full
# unit suite, and the db-backed suites against a real PostGIS.
#
# THE PROPER FIX, and why it is not a one-liner: point webServer at a real build
# (`next build && next start`). Verified safe on the data side — the prerender
# manifest lists only 7 routes, all static assets, so no page would serve stale
# data. The blocker is mail: `next start` forces NODE_ENV=production, and
# resolveMailTransport REFUSES file/console/memory transports in production on
# purpose, so the file outbox the suite reads its sign-in codes from goes away
# and nothing can sign in. Weakening that refusal is not on the table — it is
# what stops one-time codes leaking to a log. The suite therefore needs a real
# SMTP sink (mailpit as a service container, e2e/auth.ts reading codes from its
# API), which as a bonus would give the production mail path its first
# end-to-end test — the path that silently died in production once already.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Fail in twenty minutes rather than hanging for an hour: the observed
    # failure mode is a wedged dev server, not a slow suite (a healthy run is
    # about six minutes).
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://sportkarta:sportkarta@localhost:5433/sportkarta
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start ephemeral database
        run: docker compose -f compose.dev.yml up -d --wait db
      - name: Migrate and seed
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          # Sign-in codes go to a file outbox the e2e suite reads — no relay,
          # and no test-only endpoint in the app (apps/web/e2e/auth.ts).
          echo "MAIL_TRANSPORT=file" >> .env
          echo "MAIL_OUTBOX_DIR=./var/mail" >> .env
          # The contributions suite uploads a real photo; without a storage
          # root the add-facility action throws and both dobavi specs fail
          # (.env.example's dev value, resolved against apps/web).
          echo "STORAGE_DIR=./.data/storage" >> .env
          # The e2e admin account, promoted on first sign-in.
          echo "ADMIN_EMAILS=e2e@example.org" >> .env
          # Every browser in the suite shares one IP; the production cap would
          # throttle the run.
          echo "OTP_RATE_LIMIT_IP=200" >> .env
          echo "OTP_RATE_LIMIT_EMAIL=50" >> .env
          echo "OTP_RATE_LIMIT_PER_MINUTE=100" >> .env
          pnpm db:migrate
          pnpm db:seed
      - name: Install Playwright browsers
        run: pnpm --filter @sportkarta/web exec playwright install --with-deps chromium
      - name: Playwright e2e
        run: pnpm test:e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail 100
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
