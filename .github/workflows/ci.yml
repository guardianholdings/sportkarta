name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # DB-backed tests skip themselves here (no DATABASE_URL) and run in e2e.
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://sportkarta:sportkarta@localhost:5433/sportkarta
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start ephemeral database
        run: docker compose -f compose.dev.yml up -d --wait db
      - name: Migrate and seed
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          # Sign-in codes go to a file outbox the e2e suite reads — no relay,
          # and no test-only endpoint in the app (apps/web/e2e/auth.ts).
          echo "MAIL_TRANSPORT=file" >> .env
          echo "MAIL_OUTBOX_DIR=./var/mail" >> .env
          # The e2e admin account, promoted on first sign-in.
          echo "ADMIN_EMAILS=e2e@example.org" >> .env
          # Every browser in the suite shares one IP; the production cap would
          # throttle the run.
          echo "OTP_RATE_LIMIT_IP=200" >> .env
          echo "OTP_RATE_LIMIT_EMAIL=50" >> .env
          echo "OTP_RATE_LIMIT_PER_MINUTE=100" >> .env
          pnpm db:migrate
          pnpm db:seed
      - name: DB-backed unit tests (ST_DWithin smoke)
        run: pnpm --filter @sportkarta/db test
      - name: Install Playwright browsers
        run: pnpm --filter @sportkarta/web exec playwright install --with-deps chromium
      - name: Playwright e2e
        run: pnpm test:e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail 100
