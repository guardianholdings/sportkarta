name: CI

# The deploy workflow watches THIS workflow's conclusion, so everything here is
# a release gate. The Playwright suite deliberately lives in e2e.yml instead —
# see the comment at the top of that file.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from packageManager field
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # DB-backed tests skip themselves here (no DATABASE_URL) and run below.
      - run: pnpm test

  db-tests:
    # The suites that run against a real PostGIS: geospatial SQL, the merge
    # policy, moderation and leaderboard authorization, campaign scoring, the
    # report reconciliation. These assert things no unit test can, they run in
    # ~2 minutes, and they are the reason this job gates the deploy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://sportkarta:sportkarta@localhost:5433/sportkarta
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start ephemeral database
        run: docker compose -f compose.dev.yml up -d --wait db
      - name: Migrate and seed
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          pnpm db:migrate
          pnpm db:seed
      - name: DB-backed unit tests (ST_DWithin smoke)
        run: pnpm --filter @sportkarta/db test
      - name: Database logs on failure
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail 100 db
