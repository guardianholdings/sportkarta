# Weekly OSM IMPORT CANARY (docs/ROADMAP.md §3: <2% mismatch gate).
#
# A full-pipeline canary: fresh Geofabrik extract → migrate → live import into
# an EPHEMERAL CI database → 25-sample audit. It fails loudly on
# download/checksum breakage, osmium changes, constraint violations, import
# nondeterminism, or >2% field mismatch.
#
# IT SAYS NOTHING ABOUT PRODUCTION'S DATA. Every run imports into a throwaway
# database and samples that, so a green run means "the importer still works on
# today's extract" — not "the live map is right". (It was called "OSM audit"
# and read as the latter while ~69 commercial gyms sat on the production map as
# free.) A true drift audit of live data would run `pnpm import:osm:audit`
# inside the worker container over the deploy SSH path; that is still to do.
#
# The Geofabrik fetches retry a 5xx/429 (scripts/import-osm/src/download.ts):
# the one red run in its first ten was a single transient 502.
name: OSM import canary

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  osm-audit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://sportkarta:sportkarta@localhost:5433/sportkarta
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install osmium-tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends osmium-tool
      - run: pnpm install --frozen-lockfile
      - name: Start ephemeral database
        run: docker compose -f compose.dev.yml up -d --wait db
      - name: Migrate
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env
          pnpm db:migrate
      - name: Live import from current Geofabrik extract
        run: pnpm import:osm --live
      - name: 25-sample audit (fails loudly on >2% mismatch)
        run: pnpm import:osm:audit --sample 25 --threshold 2 --skip-download
      - name: Database logs on failure
        if: failure()
        run: docker compose -f compose.dev.yml logs --tail 100 db
