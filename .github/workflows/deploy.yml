name: Deploy

# Push to main = deploy, but only after CI succeeds on that commit.
# workflow_dispatch is the operator override: it deploys main HEAD without
# waiting for a fresh CI run (first deploy, secret rotation, re-deploy after
# flipping DEPLOY_ENABLED), or — with `rollback_to` — redeploys an earlier
# release's images as they are. Dispatching any other ref is refused below —
# deploys happen only from main (CLAUDE.md), and a non-main dispatch would
# also repoint the :latest image tags.
#
# SECURITY: `workflow_run` fires for EVERY completed CI run whose head branch
# is called `main`, and that includes a pull request opened from a fork's own
# `main` branch — CI runs on `pull_request`, and the fork controls its own
# ci.yml. This workflow runs with every production secret, so the `gate` job
# below admits a CI run only when it was a PUSH, to THIS repository, on main,
# and its commit is still main HEAD. Without that, a stranger's PR would be
# built, handed the server .env and started on the VPS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_to:
        description: >-
          Roll back: the full 40-character commit SHA of an earlier release to
          redeploy exactly as it was (its images must still be in GHCR). Only
          releases from 2026-09-29 on — older ones predate the dashboard lock
          and would republish Umami/GlitchTip unprotected. Leave empty to
          deploy main HEAD.
        required: false
        default: ''

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/sportkarta
  # Pinned by digest: this image hashes the admin-tools password on the runner.
  CADDY_IMAGE: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - id: decide
        # Every event field goes through env, never into the script text: a
        # branch name is attacker-chosen on a fork PR.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          ROLLBACK: ${{ github.event.inputs.rollback_to }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          skip() {
            echo "::notice::Not deploying: $1"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$REF" = "refs/heads/main" ] || skip "dispatched from $REF — deploys run from main only"
            if [ -n "$ROLLBACK" ]; then
              if ! printf '%s' "$ROLLBACK" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "::error::rollback_to must be a full 40-character lowercase commit SHA"
                exit 1
              fi
              echo "::notice::Rolling back to $ROLLBACK (no build — its images are re-pulled from GHCR)"
              { echo "deploy=true"; echo "build=false"; echo "sha=$ROLLBACK"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sha="$DISPATCH_SHA"
          else
            [ "$RUN_CONCLUSION" = "success" ] || skip "CI concluded '$RUN_CONCLUSION'"
            [ "$RUN_EVENT" = "push" ] || skip "the CI run was a '$RUN_EVENT', not a push to main"
            [ "$RUN_REPO" = "$REPO" ] || skip "the CI run came from '$RUN_REPO', not $REPO"
            [ "$RUN_BRANCH" = "main" ] || skip "the CI run was on '$RUN_BRANCH'"
            sha="$RUN_SHA"
          fi
          # A slow CI run can finish after a newer push's run. Shipping it would
          # put older code back over newer code; the run for HEAD deploys HEAD.
          head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          [ "$sha" = "$head" ] || skip "$sha is no longer main HEAD ($head)"
          { echo "deploy=true"; echo "build=true"; echo "sha=$sha"; } >> "$GITHUB_OUTPUT"

  build-push:
    needs: gate
    if: needs.gate.outputs.deploy == 'true' && needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-web:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_BASE }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push worker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-worker:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_BASE }}-worker:latest
          cache-from: type=gha
      - name: Build and push migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-migrate:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_BASE }}-migrate:latest
          cache-from: type=gha
      - name: Build and push backup
        uses: docker/build-push-action@v7
        with:
          context: deploy/backup
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backup:${{ env.DEPLOY_SHA }}
            ${{ env.IMAGE_BASE }}-backup:latest
          cache-from: type=gha

  deploy:
    needs: [gate, build-push]
    # Skipped until the VPS exists: set the repository variable DEPLOY_ENABLED
    # to 'true' (gh variable set DEPLOY_ENABLED --body true) to activate.
    # `always()` lets a rollback (build-push skipped on purpose) through; a
    # FAILED build never is.
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' && needs.gate.outputs.deploy == 'true' &&
      (needs.build-push.result == 'success' ||
       (needs.build-push.result == 'skipped' && needs.gate.outputs.build == 'false'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SHA: ${{ needs.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      # The server's host key is pinned. `accept-new` on a fresh runner accepts
      # whatever answers at DEPLOY_HOST — and the next steps pipe every
      # production secret into that connection. If the server is ever rebuilt,
      # this deploy fails with "Host key verification failed": replace the key
      # below with the new one (ssh-keyscan -t ed25519 <ip>, checked against
      # the Hetzner console) in the same commit that points at the new box.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo 'sportkarta-prod ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAIqKmg1U69CxDz2Nd7YQHozf1wU3t/Wx3r7BI1RhVlt' > ~/.ssh/known_hosts
          {
            echo "Host vps"
            echo "  HostName ${{ secrets.DEPLOY_HOST }}"
            echo "  HostKeyAlias sportkarta-prod"
            echo "  User deploy"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          } > ~/.ssh/config
      # The canonical host. A PROD_DOMAIN repository VARIABLE wins over the
      # PROD_DOMAIN secret it replaces: a domain is public, and as a secret
      # GitHub printed it as *** in every log line that names the site.
      # Neither set = IP-only mode: plain HTTP on the server address,
      # Caddyfile.ip (no TLS, no subdomains). Setting one flips everything to
      # the TLS Caddyfile and https URLs in one deploy — nothing else to change
      # (sign-in, canonical links, the sitemap and mail links all read SITE_URL).
      - name: Compute public base URL
        id: base
        env:
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN || secrets.PROD_DOMAIN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -n "$PROD_DOMAIN" ]; then
            echo "domain=$PROD_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "url=https://$PROD_DOMAIN" >> "$GITHUB_OUTPUT"
            # The server's own sslip.io name is where the site lived before it
            # had a domain, so early links, bookmarks and printed QR codes point
            # there. It keeps answering, with a redirect (deploy/Caddyfile).
            legacy=""
            if printf '%s' "$DEPLOY_HOST" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' \
              && [ "$DEPLOY_HOST.sslip.io" != "$PROD_DOMAIN" ]; then
              legacy="$DEPLOY_HOST.sslip.io"
            fi
            echo "legacy=$legacy" >> "$GITHUB_OUTPUT"
          else
            echo "domain=" >> "$GITHUB_OUTPUT"
            echo "url=http://$DEPLOY_HOST" >> "$GITHUB_OUTPUT"
            echo "legacy=" >> "$GITHUB_OUTPUT"
          fi
      - name: Ship compose, Caddyfile, initdb
        run: |
          if [ -n "${{ steps.base.outputs.domain }}" ]; then
            scp deploy/Caddyfile vps:/opt/sportkarta/Caddyfile
          else
            scp deploy/Caddyfile.ip vps:/opt/sportkarta/Caddyfile
          fi
          scp deploy/compose.prod.yml vps:/opt/sportkarta/
          scp -r deploy/initdb vps:/opt/sportkarta/
      - name: Render server .env from secrets
        run: |
          ssh vps 'umask 077 && cat > /opt/sportkarta/.env' <<'EOF'
          # Rendered by deploy.yml — do not edit by hand.
          DOMAIN=${{ steps.base.outputs.domain }}
          LEGACY_HOSTS=${{ steps.base.outputs.legacy }}
          SITE_URL=${{ steps.base.outputs.url }}
          IMAGE_TAG=${{ env.DEPLOY_SHA }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          UMAMI_APP_SECRET=${{ secrets.UMAMI_APP_SECRET }}
          GLITCHTIP_SECRET_KEY=${{ secrets.GLITCHTIP_SECRET_KEY }}
          RESTIC_REPOSITORY=${{ secrets.RESTIC_REPOSITORY }}
          RESTIC_PASSWORD=${{ secrets.RESTIC_PASSWORD }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # The backup bucket's S3 region (a repository VARIABLE; `fsn1` for
          # Hetzner Object Storage in Falkenstein). Empty = restic's default.
          AWS_DEFAULT_REGION=${{ vars.BACKUP_S3_REGION }}
          B2_ACCOUNT_ID=${{ secrets.B2_ACCOUNT_ID }}
          B2_ACCOUNT_KEY=${{ secrets.B2_ACCOUNT_KEY }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
          AUTH_GOOGLE_ENABLED=${{ vars.AUTH_GOOGLE_ENABLED || 'false' }}
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ vars.SMTP_PORT || '587' }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          # Public, non-secret settings: GitHub repository VARIABLES (Settings →
          # Secrets and variables → Actions → Variables). Empty = feature off.
          CONTACT_EMAIL=${{ vars.CONTACT_EMAIL }}
          UMAMI_SRC=${{ vars.UMAMI_SRC }}
          UMAMI_WEBSITE_ID=${{ vars.UMAMI_WEBSITE_ID }}
          GLITCHTIP_DSN=${{ vars.GLITCHTIP_DSN }}
          PARTNER_STRIP_ENABLED=${{ vars.PARTNER_STRIP_ENABLED }}
          DONATION_IBAN=${{ vars.DONATION_IBAN }}
          DONATION_BENEFICIARY=${{ vars.DONATION_BENEFICIARY }}
          DONATION_BIC=${{ vars.DONATION_BIC }}
          DONATION_REFERENCE=${{ vars.DONATION_REFERENCE }}
          DONATION_PAYMENT_URL=${{ vars.DONATION_PAYMENT_URL }}
          THUNDERFOREST_API_KEY=${{ secrets.THUNDERFOREST_API_KEY }}
          TRACESTRACK_API_KEY=${{ secrets.TRACESTRACK_API_KEY }}
          # The association's identity as registered, shown on /kontakt,
          # /privacy and /usloviya (GDPR Art. 13, DSA Art. 11-12). Repository
          # VARIABLES, one line each; empty = the line is omitted on the site.
          # Keep `#` and `$` out of them: this is a compose .env file.
          ORG_LEGAL_NAME=${{ vars.ORG_LEGAL_NAME }}
          ORG_EIK=${{ vars.ORG_EIK }}
          ORG_ADDRESS=${{ vars.ORG_ADDRESS }}
          EOF
      # Values computed from other secrets rather than stored separately.
      # Written single-quoted: compose interpolates `$` in unquoted .env values.
      - name: Render derived settings
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CHECKIN_TOKEN_SECRET: ${{ secrets.CHECKIN_TOKEN_SECRET }}
          ADMIN_TOOLS_PASSWORD: ${{ secrets.ADMIN_TOOLS_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          set -euo pipefail
          # QR check-in signs its tokens with CHECKIN_TOKEN_SECRET, and with it
          # unset the feature is OFF (apps/web/lib/checkin-config.ts, fail
          # closed). Unless one is stored explicitly, derive a stable key from
          # AUTH_SECRET — a separate key for a separate purpose, never the raw
          # auth secret, and the same on every deploy so printed QR codes keep
          # working. No AUTH_SECRET means no derivation: still fail closed.
          checkin="${CHECKIN_TOKEN_SECRET:-}"
          if [ -z "$checkin" ] && [ -n "${AUTH_SECRET:-}" ]; then
            checkin=$(printf '%s' 'pops/checkin-token/v1' | openssl dgst -sha256 -hmac "$AUTH_SECRET" -r | cut -d' ' -f1)
          fi
          # The Umami and GlitchTip dashboards sit behind HTTP basic auth
          # (user "admin"). With no ADMIN_TOOLS_PASSWORD secret the hash is of a
          # random throwaway, so the dashboards are CLOSED to everyone — the
          # safe default for two apps whose own logins were never set up.
          pw="${ADMIN_TOOLS_PASSWORD:-}"
          [ -n "$pw" ] || pw=$(openssl rand -hex 32)
          hash=$(docker run --rm "$CADDY_IMAGE" caddy hash-password --plaintext "$pw" | tr -d '\r\n' | base64 -w0)
          # GlitchTip mails its own password resets and alerts; without this it
          # prints them to its console, where nobody reads them.
          gt_mail=$(python3 - <<'PY'
          import os, urllib.parse as u
          env = os.environ.get
          q = lambda s: u.quote(s, safe="")
          host, user, pw = env("SMTP_HOST", ""), env("SMTP_USER", ""), env("SMTP_PASS", "")
          port = env("SMTP_PORT") or "587"
          print(f"smtp+tls://{q(user)}:{q(pw)}@{host}:{port}" if host and user else "consolemail://")
          PY
          )
          {
            printf "CHECKIN_TOKEN_SECRET='%s'\n" "$checkin"
            printf "ADMIN_TOOLS_HASH='%s'\n" "$hash"
            printf "GLITCHTIP_EMAIL_URL='%s'\n" "$gt_mail"
            printf "GLITCHTIP_FROM_EMAIL='%s'\n" "${SMTP_FROM:-}"
          } | ssh vps 'umask 077 && cat >> /opt/sportkarta/.env'
      - name: Log VPS into GHCR (private images)
        run: |
          ssh vps "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
      - name: Pull images, migrate, seed, start stack
        run: |
          ssh vps 'cd /opt/sportkarta \
            && docker compose -f compose.prod.yml pull -q \
            && docker compose -f compose.prod.yml up -d --wait db \
            && docker compose -f compose.prod.yml --profile ops run --rm init-storage \
            && docker compose -f compose.prod.yml --profile ops run --rm migrate \
            && docker compose -f compose.prod.yml --profile ops run --rm migrate pnpm db:seed --production \
            && docker compose -f compose.prod.yml up -d --remove-orphans \
            && { docker compose -f compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
                 || docker compose -f compose.prod.yml restart caddy; } \
            && docker image prune -af'
          # Every deploy pulls four fresh images and strands the previous four.
          # Nothing was reclaiming them: 27 images / 19 GB had accumulated on
          # the same filesystem as pgdata, and a `--filter until=…` prune is no
          # use here because the images stranded by THIS deploy are minutes old.
          # A bare `-af` is safe — it keeps every image referenced by a
          # container, running or stopped — and rollback still works because the
          # tags live in GHCR and are re-pulled (see `rollback_to` above).
          # `--production` seeds no fixtures — only the _health row, population
          # and the stats refresh (db/scripts/seed-plan.ts) — and is idempotent.
          # It also retires, once, the seed fixtures a hand-run full seed left
          # here (Boss decision #18): exported first to the server's
          # seed-exports volume, then status 'gone', before the stats refresh.
          # Every later deploy finds nothing to retire.
          # The health gate below depends on it: /api/health
          # smoke-queries the _health row, which migrations never create.
          # Without this step every deploy to a fresh box fails its health
          # check with "st_dwithin smoke query found no rows".
          # The Caddyfile is a bind mount read at startup: compose only
          # recreates caddy when its SERVICE config changes, so a shipped
          # Caddyfile edit needs an explicit reload. `caddy reload` swaps the
          # config gracefully — a restart dropped every open connection on every
          # deploy — and the restart remains as the fallback if reload fails.
      # THE GATE WAITS FOR THIS DEPLOY'S WORKER (pre-launch audit finding 133).
      # /api/health alone only goes red once the last worker ping is twenty
      # minutes old, and the PREVIOUS worker pinged minutes before `up -d`, so a
      # new worker that dies on boot stayed green through the whole gate — and
      # nothing reads /api/health afterwards. So the gate asks the narrower
      # question: has the worker container running NOW completed a ping since it
      # started? The worker pings as the last step of booting, so a healthy one
      # answers within seconds and one that crashes on the way up never does.
      # The start time is Docker's, read on the VPS — the clock the database
      # stamps the ping with. A re-run that did not recreate the worker is
      # answered by that same worker's last five-minute ping.
      - name: Health check (fail loudly)
        run: |
          since=$(ssh vps 'cd /opt/sportkarta \
            && id=$(docker compose -f compose.prod.yml ps -a -q worker | head -n1) \
            && [ -n "$id" ] \
            && date -u -d "$(docker inspect -f "{{.State.StartedAt}}" "$id")" +%s%3N' || true)
          if ! printf '%s' "$since" | grep -Eq '^[0-9]{13}$'; then
            echo "::error::DEPLOY HEALTH CHECK FAILED — no worker container start time to wait for (got '$since')"
            exit 1
          fi
          url="${{ steps.base.outputs.url }}/api/health?workerSince=$since"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$url"; then
              echo
              echo "Deploy healthy: $url"
              exit 0
            fi
            echo "attempt $i/20 failed; retrying in 15s"
            sleep 15
          done
          echo "::error::DEPLOY HEALTH CHECK FAILED for $url — site is NOT confirmed healthy"
          curl -sS --max-time 10 "$url" || true
          exit 1
